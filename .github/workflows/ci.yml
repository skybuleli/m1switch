name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -B build -S .

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: |
        cmake --build build --target all_tests
        ./build/tests/all_tests

    - name: Build headless
      run: |
        cmake --build build --target m1switch_headless 2>/dev/null || \
        echo "Headless target not available (expected without GUI support)"
